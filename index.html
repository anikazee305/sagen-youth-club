<!DOCTYPE html>
<html>
<head>
<title>SAGEN YOUTH CLUB</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
font-family: Arial;
margin:0;
background: linear-gradient(to right, #1e3c72, #fbd786);
color:white;
text-align:center;
}
header{
padding:30px;
font-size:28px;
font-weight:bold;
}
.section{
background:white;
color:black;
margin:20px;
padding:20px;
border-radius:15px;
}
button{
padding:10px 20px;
border:none;
border-radius:10px;
background:#1e3c72;
color:white;
cursor:pointer;
}
input, textarea{
width:90%;
padding:10px;
margin:5px;
}
</style>
</head>

<body>

<header>SAGEN YOUTH CLUB</header>

<div class="section">
<h2>About Our Club</h2>
<p>Welcome to Sagen Youth Club. We organize social activities, sports, cultural programs and youth development events.</p>
</div>

<div class="section">
<h2>Member Registration</h2>
<input type="text" placeholder="Your Name"><br>
<input type="email" placeholder="Email"><br>
<textarea placeholder="About You"></textarea><br>
<button>Register</button>
</div>

<div class="section">
<h2>Club Activities</h2>
<p>Photos and activity updates will be posted here.</p>
<button>Like 👍</button>
</div>

<div class="section">
<h2>Club Chat</h2>
<input type="text" placeholder="Type message...">
<button>Send</button>
</div>

</body>
                                          </html>
